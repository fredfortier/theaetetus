description: Dialectical skills working-set and matched-control evaluation

providers:
  - id: openai:codex-sdk
    label: current
    config:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      working_dir: ./.runs/{{caseId}}/{{runIndex}}/current
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      persist_threads: false
      enable_streaming: true
  - id: openai:codex-sdk
    label: mechanical-placebo
    config:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      working_dir: ./.runs/{{caseId}}/{{runIndex}}/mechanical-placebo
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      persist_threads: false
      enable_streaming: true
  - id: openai:codex-sdk
    label: no-skill
    config:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      working_dir: ./.runs/{{caseId}}/{{runIndex}}/no-skill
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      persist_threads: false
      enable_streaming: true

prompts:
  - id: natural-request
    label: Natural request
    raw: file://prompts/inquiry.txt

defaultTest:
  options:
    disableVarExpansion: false

assertionTemplates:
  noPersonDiagnosis:
    type: javascript
    value: file://assertions/no-person-diagnosis.js
    metric: HardSafety
  sourceUrlAllowlist:
    type: javascript
    value: file://assertions/source-url-allowlist.js
    metric: HardEvidenceBoundary
  workspaceContract:
    type: javascript
    value: file://assertions/workspace-contract.js
    metric: HardArtifact
  tutorMarkers:
    type: javascript
    value: file://assertions/tutor-markers.js
    metric: HardLifecycle
  evidenceBoundary:
    type: javascript
    value: file://assertions/evidence-boundary.js
    metric: HardEvidenceBoundary
  sourceSummaryRubric:
    type: agent-rubric
    value: file://assertions/rubric-value.js:sourceSummary
    threshold: 0.95
    metric: HardSourceFaithfulness
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/current
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
  inquiryCurrentRubric:
    type: agent-rubric
    value: file://assertions/rubric-value.js:inquiry
    threshold: 0.95
    metric: DialecticalOutcome
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/current
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
  inquiryPlaceboRubric:
    type: not-agent-rubric
    value: file://assertions/rubric-value.js:inquiry
    threshold: 0.95
    metric: PlaceboRejected
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/mechanical-placebo
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
  tutorCurrentRubric:
    type: agent-rubric
    value: file://assertions/rubric-value.js:tutor
    threshold: 0.95
    metric: DialecticalOutcome
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/current
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
  tutorPlaceboRubric:
    type: not-agent-rubric
    value: file://assertions/rubric-value.js:tutor
    threshold: 0.95
    metric: PlaceboRejected
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/mechanical-placebo
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
tests:
  - file://tests/inquiry-working.yaml
  - file://tests/tutor-working.yaml
  - file://tests/mechanical-placebo.yaml
  - file://tests/no-skill.yaml
  - file://tests/domain-working.yaml

evaluateOptions:
  maxConcurrency: 3

outputPath: evals/promptfoo/results/unit.json
