description: Legacy diagnostic changed-case set; sealed status does not establish transfer

providers:
  - id: openai:codex-sdk
    label: current
    config:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      working_dir: ./.runs/{{caseId}}/{{runIndex}}/current
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      cli_env:
        CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
      persist_threads: false
      enable_streaming: true

prompts:
  - id: natural-request
    label: Natural request
    raw: file://prompts/inquiry.txt

defaultTest:
  options:
    disableVarExpansion: false

tests:
  - file://tests/holdout.yaml
  - file://tests/domain-holdout.yaml

evaluateOptions:
  maxConcurrency: 3

outputPath: evals/promptfoo/results/holdout.json
