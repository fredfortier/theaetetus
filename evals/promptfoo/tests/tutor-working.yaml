- description: DT-ROUTE-01 direct quoted-move coaching routes only to tutor
  providers: [current]
  vars:
    caseId: dt-route-01
    variant: current
    runIndex: ['0', '1', '2']
    contract: no-workpad
    markerContract: pause-only
    expectedOutcome: >-
      Use the tutor only, quote the broad “best” move, coach one missing discriminating-premise
      function, require the human to author the retry, and create no workpad.
    request: |-
      Invoke $dialectical-tutor to coach this live midwife move.
      Subject: service-boundary ownership.
      Latest oracle answer: “The view and controller are both plausible owners; the answer depends
      on which invariant must survive across both views.”
      Human move: “What architecture is best?”
      Decision objective: select the owner of the shared validation invariant.
      Observed evidence: the question leaves the discriminating ownership premise unspecified.
      Live question to preserve: which owner should define validation?
  assert:
    - type: skill-used
      value: dialectical-tutor
      metric: Routing
      weight: 0
    - type: not-skill-used
      value: dialectical-inquiry
      metric: Routing
      weight: 0
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/workspaceContract'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/tutorMarkers'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/noPersonDiagnosis'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/tutorCurrentRubric'

