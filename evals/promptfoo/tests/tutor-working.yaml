- description: DT-MECH-01 repairs category completion through responsive listening
  providers: [current]
  vars:
    caseId: dt-mech-01
    variant: current
    runIndex: ['0', '1', '2']
    contract: no-workpad
    markerContract: pause-only
    expectedOutcome: >-
      Quote the repeated category-switching behavior, identify responsive use of the oracle's last
      claim as the one missing function, and require one human-authored follow-up tied to that claim
      without supplying a polished question.
    request: |-
      Invoke $dialectical-tutor. Read sources/PE16.md and sources/W14.md. Coach this live exchange:

      Human: “What does ownership mean here?”
      Oracle: “Ownership tracks authority over the invariant, not the component that renders it.”
      Human: “I have done clarification. Next category: what evidence supports it?”
      Oracle: “In this conceptual case, a second view is discriminating: view ownership predicts
      separate lifetimes, while controller ownership predicts one shared selection lifetime.”
      Human: “I have done evidence. Next category: what assumptions are involved? The checklist
      proves my inquiry is rigorous.”

      The live question is whether category completion is sufficient. Coach from the quoted moves,
      use the latest oracle claim, and do not write the repaired question for me.
  assert:
    - type: skill-used
      value: dialectical-tutor
      metric: Routing
      weight: 0
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/workspaceContract'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/tutorMarkers'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/noPersonDiagnosis'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/sourceUrlAllowlist'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/tutorCurrentRubric'

