- description: DT-RETRY-01 accepts an awkward but epistemically adequate retry
  providers: [current]
  vars:
    caseId: dt-retry-01
    variant: current
    runIndex: ['0', '1', '2']
    contract: no-workpad
    markerContract: return-only
    expectedOutcome: >-
      Judge the rough retry by its evidence-versus-inference function, acknowledge that recovery in
      one sentence, return exactly once, preserve the retry, and add no style correction or new
      technique.
    request: |-
      Invoke $dialectical-tutor. Read sources/KPU19.md and sources/PE16.md.
      Prior coaching: distinguish what the source directly says from what the oracle inferred.
      Human retry: “source say throughput went up; reliable part, that oracle add, not in source.
      what bridge make those same?”
      Assess this retry's epistemic function, not its grammar, then return control if adequate.
  assert:
    - type: skill-used
      value: dialectical-tutor
      metric: Routing
      weight: 0
