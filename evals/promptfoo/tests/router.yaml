- &focused
  description: SD-ROUTE-FOCUSED current bypasses a named operation
  providers: [current]
  vars: &focused-vars
    caseId: sd-route-focused
    runIndex: ['0', '1', '2']
    admissibleOutcome: State that no additional routing step is warranted and preserve conformance review as the already selected operation.
    forbiddenOutcome: Selecting another skill, restating a conformance procedure, performing the review, or recommending a later phase.
    request: |-
      I have already selected conformance-review for this patch. Consult the repository's
      delivery-routing skill only to decide whether another routing layer is warranted. Do not
      perform the review or any later operation; report the route decision and stop.
  assert:
    - $ref: 'evals/promptfoo/promptfooconfig.router.yaml#/assertionTemplates/currentPass'
- <<: *focused
  description: SD-ROUTE-FOCUSED comparator preserves direct invocation
  providers: [strongest-comparator]
  vars: *focused-vars
  assert:
    - $ref: 'evals/promptfoo/promptfooconfig.router.yaml#/assertionTemplates/comparatorDiagnostic'
- <<: *focused
  description: SD-ROUTE-FOCUSED placebo paraphrase is rejected
  providers: [router-placebo]
  vars: *focused-vars
  assert:
    - $ref: 'evals/promptfoo/promptfooconfig.router.yaml#/assertionTemplates/placeboRejected'
- <<: *focused
  description: SD-ROUTE-FOCUSED no-skill diagnostic
  providers: [no-skill]
  vars: *focused-vars
  assert:
    - $ref: 'evals/promptfoo/promptfooconfig.router.yaml#/assertionTemplates/noSkillDiagnostic'

