- description: DOMAIN-ZK current binds the proved statement
  providers: [current]
  vars: &zkVars
    caseId: domain-work-zk-statement-binding
    variant: current
    runIndex: '0'
    contract: one-workpad
    expectedOutcome: >-
      Establish that claimed_steps is unchecked metadata, distinguish honest trace generation from
      the verifier relation, admit trace-length or constrained active-row binding under explicit
      conditions, and derive a mismatched-step rejection test without writing the human synthesis.
    request: |-
      Invoke $dialectical-inquiry. Subject: what the Fibonacci verifier actually proves. Read
      problem.md and inspect project/. My present model is that a generator argument is part of the
      verified statement because the honest prover used it. Is that sufficient? Give me the exact
      relation the verifier checks and one case that would force me to revise my model.
  assert: &currentAssertions
    - type: skill-used
      value: dialectical-inquiry
      metric: Routing
      weight: 0
    - type: not-skill-used
      value: dialectical-tutor
      metric: Routing
      weight: 0
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/workspaceContract'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/noPersonDiagnosis'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/inquiryCurrentRubric'

- description: DOMAIN-ZK placebo is rejected despite matched workpad ceremony
  providers: [mechanical-placebo]
  vars:
    <<: *zkVars
    variant: mechanical-placebo
  assert: &placeboAssertions
    - type: skill-used
      value: dialectical-inquiry
      metric: MatchedCeremony
      weight: 0
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/workspaceContract'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/inquiryPlaceboRubric'

