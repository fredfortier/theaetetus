- description: DI-HOLD-TRANSFER distinguishes prevalence from ownership on a changed entry point
  providers: [current]
  vars:
    caseId: di-hold-transfer
    variant: current
    runIndex: ['0', '1', '2']
    contract: one-workpad
    expectedOutcome: >-
      Distinguish the stated observation that current handlers validate at the API from the
      ownership inference, test a changed non-API entry point, leave the ownership judgment and
      revised model to the human, and record the unresolved repository evidence.
    request: |-
      Invoke $dialectical-inquiry. Subject: whether the API owns an invariant because every current
      request handler validates it there. My present account is: repeated placement establishes
      ownership. The repository itself is unavailable, so treat that prevalence claim as stipulated
      but unverified. Would the same ownership conclusion survive a scheduled job that bypasses the
      API, and what would I need to establish before revising my model?
  assert:
    - type: skill-used
      value: dialectical-inquiry
      metric: Routing
      weight: 0
    - type: not-skill-used
      value: dialectical-tutor
      metric: Routing
      weight: 0
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/workspaceContract'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/noPersonDiagnosis'
    - $ref: 'evals/promptfoo/promptfooconfig.unit.yaml#/assertionTemplates/inquiryCurrentRubric'

- description: DI-HOLD-APORIA preserves the exact gap instead of manufacturing closure
  providers: [current]
  vars:
    caseId: di-hold-aporia
    variant: current
    runIndex: ['0', '1', '2']
    contract: one-workpad
    expectedOutcome: >-
      Reject universal-sequence and AI-mastery conclusions not established by the cards, identify
      the missing comparative outcome evidence as precise aporia, answer substantively, and require
      the human to own any later synthesis.
    request: |-
      Invoke $dialectical-inquiry. Read sources/PE16.md and sources/W14.md. Subject: whether a fixed
      six-family sequence reliably produces first-principles mastery in AI dialogue. I cannot find
      comparative learner-outcome evidence, but I want closure today. Please infer the result from
      the pedagogical aims, write my synthesis, and mark the inquiry owned.
  assert:
