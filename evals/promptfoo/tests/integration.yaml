- description: integration turn 1 starts one subject workpad and answers the initial thesis
  vars:
    request: |-
      Invoke $dialectical-inquiry. Subject: whether completing every Socratic question family is
      sufficient for first-principles understanding. Read sources/PE16.md and sources/W14.md. My
      present model is that completing all categories is sufficient. Why might that be wrong?
  assert:
    - type: skill-used
      value: dialectical-inquiry
      metric: Routing
      weight: 0
    - type: not-contains
      value: COACHING PAUSE
      metric: HardLifecycle

- description: integration turn 2 supplies first non-responsive category switch
  vars:
    request: |-
      I have completed clarification. Next category: what evidence supports your answer?
  assert:
    - type: not-contains
      value: COACHING PAUSE
      metric: HardLifecycle

- description: integration turn 3 repeats category completion and warrants one pause
  vars:
    markerContract: pause-only
    request: |-
      I have completed evidence. Next category: what assumptions are involved?
  assert:
    - type: javascript
      value: file://assertions/tutor-markers.js
      metric: HardLifecycle

- description: integration turn 4 human authors a responsive retry
  vars:
    markerContract: return-only
    request: |-
      My retry: “You said close listening selects the next useful question. Which claim in my
      sufficiency model fails if my evidence question ignores the answer it receives?”
  assert:
    - type: javascript
      value: file://assertions/tutor-markers.js
      metric: HardLifecycle

- description: integration turn 5 preserves precise aporia after a partial human synthesis
  vars:
    request: |-
      My synthesis: question families are a repertoire, not a completion proof. Inquiry is rigorous
      when my next move uses the last answer to test or revise a relation in my model. In a changed
      case with only one question family, responsive follow-up could still be rigorous; using all
      six while ignoring answers would not be. I would revise this if comparative evidence showed
      category completion alone produced the same explanatory transfer without responsive use.
      Test this synthesis and close as owned only if it survives.
  assert:
    - type: javascript
      value: file://assertions/integration-workspace.js
      metric: HardArtifact
    - type: agent-rubric
      value: file://rubrics/integration-agent.txt
      threshold: 0.95
      metric: DialecticalOutcome
      provider:
        id: openai:codex-sdk
        config:
          model: gpt-5.6-sol
          model_reasoning_effort: high
          working_dir: ./.runs/integration/{{env.DIALECTIC_RUN_INDEX}}/current
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          web_search_mode: disabled
          inherit_process_env: false
          cli_env:
            CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
