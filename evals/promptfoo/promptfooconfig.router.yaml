description: Legacy diagnostic router comparison; prompts are over-cued and non-admissible

providers:
  - id: openai:codex-sdk
    label: current
    config:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      working_dir: ./.runs/{{caseId}}/{{runIndex}}/current
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      cli_env:
        CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
      persist_threads: false
      enable_streaming: true
  - id: openai:codex-sdk
    label: strongest-comparator
    config:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      working_dir: ./.runs/{{caseId}}/{{runIndex}}/strongest-comparator
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      cli_env:
        CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
      persist_threads: false
      enable_streaming: true
  - id: openai:codex-sdk
    label: router-placebo
    config:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      working_dir: ./.runs/{{caseId}}/{{runIndex}}/router-placebo
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      cli_env:
        CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
      persist_threads: false
      enable_streaming: true
  - id: openai:codex-sdk
    label: no-skill
    config:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      working_dir: ./.runs/{{caseId}}/{{runIndex}}/no-skill
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      cli_env:
        CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
      persist_threads: false
      enable_streaming: true

prompts:
  - id: route-only-request
    label: Route-only request
    raw: file://prompts/inquiry.txt

assertionTemplates:
  currentPass:
    type: agent-rubric
    value: file://assertions/router-rubric-value.js
    threshold: 0.95
    metric: RouterOutcome
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/current
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
        cli_env:
          CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
  comparatorDiagnostic:
    type: agent-rubric
    value: file://assertions/router-rubric-value.js
    threshold: 0.95
    metric: ComparatorOutcome
    weight: 0
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/strongest-comparator
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
        cli_env:
          CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
  placeboRejected:
    type: not-agent-rubric
    value: file://assertions/router-rubric-value.js
    threshold: 0.95
    metric: PlaceboRejected
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/router-placebo
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
        cli_env:
          CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
  noSkillDiagnostic:
    type: agent-rubric
    value: file://assertions/router-rubric-value.js
    threshold: 0.95
    metric: NoSkillCapability
    weight: 0
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./.runs/{{caseId}}/{{runIndex}}/no-skill
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
        cli_env:
          CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"

tests:
  - file://tests/router.yaml

evaluateOptions:
  maxConcurrency: 3

outputPath: evals/promptfoo/results/router.json
