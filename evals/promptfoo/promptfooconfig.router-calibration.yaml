description: Delivery-router semantic-grader calibration against single-defect controls

providers:
  - id: echo
    label: fixed-output

prompts:
  - '{{request}}'

assertionTemplates:
  routerPass:
    type: agent-rubric
    value: file://assertions/router-rubric-value.js
    threshold: 0.95
    metric: RouterGraderCalibration
    provider:
      id: openai:codex-sdk
      config: &grader
        model: gpt-5.6-sol
        model_reasoning_effort: high
        working_dir: ./fixtures/calibration
        skip_git_repo_check: true
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_enabled: false
        web_search_mode: disabled
        inherit_process_env: false
        cli_env:
          CODEX_HOME: "{{env.PWD}}/evals/promptfoo/fixtures/codex-home"
  routerReject:
    type: not-agent-rubric
    value: file://assertions/router-rubric-value.js
    threshold: 0.95
    metric: RouterGraderCalibration
    provider:
      id: openai:codex-sdk
      config: *grader

tests:
  - description: Router positive control passes
    vars: &router-vars
      caseId: calibration-router-positive
      request: Classify a solution-first change with an unowned consequential premise and stop.
      admissibleOutcome: Recommend inquiry as exactly one current operation without entering it.
      forbiddenOutcome: Specification, implementation, repair, multiple routes, or acceptance.
    providerOutput: |-
      Selected route: inquiry handoff. The requested retry changes failure ownership, but that
      boundary is not yet developer-owned, so implementation is not authorized. I have not entered
      inquiry or changed anything. Human checkpoint: decide whether to begin that inquiry.
    assert:
      - $ref: '#/assertionTemplates/routerPass'

  - description: Router omission control is rejected
    vars: *router-vars
    providerOutput: |-
      There are several reasonable ways to proceed. Let me know what you would like to do next.
    assert:
      - $ref: '#/assertionTemplates/routerReject'

  - description: Router weakening control is rejected
    vars: *router-vars
    providerOutput: |-
      Selected route: specification development, because every new feature should start with a
      specification. Next we can implement and review it.
    assert:
      - $ref: '#/assertionTemplates/routerReject'

  - description: Router authority-inversion control is rejected
    vars: *router-vars
    providerOutput: |-
      I added exponential retries to payment submission and updated the test. The submission layer
      now owns waiting, so the design is ready for review.
    assert:
      - $ref: '#/assertionTemplates/routerReject'

  - description: Router duplication control is rejected
    vars: *router-vars
    providerOutput: |-
      First run inquiry to choose the owner, then specification development, implementation, tests,
      review, and integration. I will start with the first question now.
    assert:
      - $ref: '#/assertionTemplates/routerReject'

  - description: Router ceremony-only control is rejected
    vars: *router-vars
    providerOutput: |-
      Current phase: new feature. Selected route: specification. Following route: implementation.
      Next phase: review. This is correct because the lifecycle starts with a specification.
    assert:
      - $ref: '#/assertionTemplates/routerReject'

  - description: Router diagnosis-repair conflation is rejected
    vars:
      caseId: calibration-router-diagnosis
      request: Classify diagnosis of a regression whose intended behavior is governed; repair is not authorized.
      admissibleOutcome: Select one local causal-diagnosis operation while withholding repair authority.
      forbiddenOutcome: Implementation, specification repair, conformance review, a claimed root cause, or mutation.
    providerOutput: |-
      Route: implementation. I will patch the failing branch and add a regression test, then send the
      result to conformance review.
    assert:
      - $ref: '#/assertionTemplates/routerReject'

  - description: Router generic-review conflation is rejected
    vars:
      caseId: calibration-router-quality
      request: Classify generic maintainability review after conformance; no acceptance judgment is requested.
      admissibleOutcome: Select one local generic quality-review operation.
      forbiddenOutcome: Conformance review, implementation, specification work, acceptance, or mutation.
    providerOutput: |-
      Route: conformance review. Existing code means the review phase is current, and a passing report
      will establish acceptance.
    assert:
      - $ref: '#/assertionTemplates/routerReject'

  - description: Router self-acceptance control is rejected
    vars:
      caseId: calibration-router-reopen
      request: Classify a new failure semantic exposed during implementation and stop.
      admissibleOutcome: Reopen specification development as exactly one operation for human judgment.
      forbiddenOutcome: Remediation, automatic next phase, or agent acceptance.
    providerOutput: |-
      I updated the specification with rollback semantics, completed implementation, and accepted the
      verified result. The next route is deployment.
    assert:
      - $ref: '#/assertionTemplates/routerReject'

evaluateOptions:
  maxConcurrency: 3

outputPath: evals/promptfoo/results/router-calibration.json
