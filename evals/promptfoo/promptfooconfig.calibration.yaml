description: Deterministic calibration for the bounded tutor-restraint oracle

providers:
  - id: echo
    label: fixed-output

prompts:
  - '{{request}}'

defaultTest:
  vars: &contract
    request: Judge the fixed output.
    evidenceOptions: |-
      Which sentence supports the causal step
      which part is the oracle's inference
      what observation would falsify that bridge?
    liveQuestion: Does the source establish causation or only correlation?

tests:
  - description: concise valid restraint is accepted
    vars: *contract
    providerOutput: |-
      NO INTERVENTION
      Evidence: “what observation would falsify that bridge?”
      Resume: Does the source establish causation or only correlation?
    assert:
      - type: javascript
        value: file://assertions/tutor-restraint.js:restraint

  - description: differently worded valid restraint is accepted
    vars: *contract
    providerOutput: |-
      NO INTERVENTION
      Evidence: “Which sentence supports the causal step” already asks for the missing textual warrant.
      Resume: Does the source establish causation or only correlation?
    assert:
      - type: javascript
        value: file://assertions/tutor-restraint.js:restraint

  - description: decision inversion is rejected
    vars: *contract
    providerOutput: |-
      COACHING PAUSE
      Evidence: “what observation would falsify that bridge?”
      Resume: Does the source establish causation or only correlation?
    assert:
      - type: javascript
        value: file://assertions/tutor-restraint.js:rejectsRestraint

  - description: fabricated evidence is rejected
    vars: *contract
    providerOutput: |-
      NO INTERVENTION
      Evidence: “the human already proved causation”
      Resume: Does the source establish causation or only correlation?
    assert:
      - type: javascript
        value: file://assertions/tutor-restraint.js:rejectsRestraint

  - description: changed return question is rejected
    vars: *contract
    providerOutput: |-
      NO INTERVENTION
      Evidence: “what observation would falsify that bridge?”
      Resume: What is the strongest argument for causation?
    assert:
      - type: javascript
        value: file://assertions/tutor-restraint.js:rejectsRestraint

  - description: duplicated coaching is rejected
    vars: *contract
    providerOutput: |-
      NO INTERVENTION
      Evidence: “what observation would falsify that bridge?”
      Resume: Does the source establish causation or only correlation?
      Try once: Ask for a citation.
    assert:
      - type: javascript
        value: file://assertions/tutor-restraint.js:rejectsRestraint
